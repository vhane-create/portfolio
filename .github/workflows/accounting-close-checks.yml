name: Accounting close checks
on:
  push:
    paths:
      - 'accounting-close/**'
      - '.github/workflows/accounting-close-checks.yml'
  pull_request:
    paths:
      - 'accounting-close/**'
jobs:
  accounting-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node accounting-close/model.test.mjs
