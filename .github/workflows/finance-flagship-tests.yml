name: Finance flagship regression tests
on:
  push:
    paths:
      - 'three-statement-forecast/**'
      - 'global-consolidation/**'
      - 'workforce-planning/**'
      - 'financial-controls-sox/**'
      - 'treasury-liquidity/**'
      - 'enterprise-data-pipeline/**'
      - 'enterprise-fpa-command-center/**'
      - 'finance-automation/**'
      - 'npv-irr-model/**'
      - 'tests/**'
      - '.github/workflows/finance-flagship-tests.yml'
  pull_request:
    paths:
      - 'three-statement-forecast/**'
      - 'global-consolidation/**'
      - 'workforce-planning/**'
      - 'financial-controls-sox/**'
      - 'treasury-liquidity/**'
      - 'enterprise-data-pipeline/**'
      - 'enterprise-fpa-command-center/**'
      - 'finance-automation/**'
      - 'npv-irr-model/**'
      - 'tests/**'
jobs:
  model-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run six flagship model checks
        run: node tests/flagship-models.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate expense bridge and verify monthly command center
        run: |
          python finance-automation/report.py
          python -m unittest discover -s finance-automation -p 'test_*.py'
          node enterprise-fpa-command-center/model.test.mjs
