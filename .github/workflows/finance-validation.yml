name: Finance portfolio validation
on:
  push:
    paths:
      - 'finance-automation/**'
      - '.github/workflows/finance-validation.yml'
  pull_request:
    paths:
      - 'finance-automation/**'
      - '.github/workflows/finance-validation.yml'
  workflow_dispatch:
jobs:
  python-report-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute regression tests
        run: python -m unittest discover -s finance-automation -p 'test_*.py' -v
      - name: Execute financial reporting
        run: python finance-automation/report.py
      - name: Upload sample outputs
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-finance-report-outputs
          path: finance-automation/output/
